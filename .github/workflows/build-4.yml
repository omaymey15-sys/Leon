name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Le fichier de données linguistiques Tesseract (français) fait plusieurs Mo :
      # on le télécharge ici plutôt que de l'uploader manuellement sur GitHub.
      - name: Télécharger les données OCR (français + anglais)
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -L -f -o app/src/main/assets/tessdata/fra.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/fra.traineddata
          curl -L -f -o app/src/main/assets/tessdata/eng.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata

      # Polices Inter/Poppins pour un rendu plus premium (voir ui/theme/AppFonts.kt).
      # Non bloquant : si un chemin a changé côté Google Fonts, l'app retombe simplement
      # sur Roboto (police système) au lieu de faire échouer tout le build.
      - name: Télécharger les polices (Inter, Poppins)
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -L -f -o app/src/main/assets/fonts/inter_regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/inter/static/Inter-Regular.ttf
          curl -L -f -o app/src/main/assets/fonts/inter_medium.ttf \
            https://github.com/google/fonts/raw/main/ofl/inter/static/Inter-Medium.ttf
          curl -L -f -o app/src/main/assets/fonts/inter_semibold.ttf \
            https://github.com/google/fonts/raw/main/ofl/inter/static/Inter-SemiBold.ttf
          curl -L -f -o app/src/main/assets/fonts/inter_bold.ttf \
            https://github.com/google/fonts/raw/main/ofl/inter/static/Inter-Bold.ttf
          curl -L -f -o app/src/main/assets/fonts/poppins_medium.ttf \
            https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Medium.ttf
          curl -L -f -o app/src/main/assets/fonts/poppins_semibold.ttf \
            https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-SemiBold.ttf
          curl -L -f -o app/src/main/assets/fonts/poppins_bold.ttf \
            https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf

      # Pas de gradlew committé (projet créé sans PC) : on installe Gradle directement.
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Tests unitaires
        run: gradle test --stacktrace

      - name: Build APK debug
        run: gradle assembleDebug --stacktrace

      - name: Uploader l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: myschool-ocr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # La release n'est signée QUE si les secrets ci-dessous sont configurés dans le repo
      # (Settings > Secrets and variables > Actions). Sans eux, cette étape est sautée.
      - name: Décoder le keystore de signature
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build APK release (signé)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Uploader l'APK release signé
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: myschool-ocr-release-apk
          path: app/build/outputs/apk/release/app-release.apk
